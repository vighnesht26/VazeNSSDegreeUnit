<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <link href="../output.css" rel="stylesheet">
  <script src="dashboard_student.js" defer></script>
 
  <title>Volunteer Dashboard</title>

</head>
<body class="flex flex-col h-screen" >
  <header class="top-header sticky top-0  flex items-center justify-between w-full h-24 px-6 text-white">
  
  <!-- Main Heading-->
  <div class="flex items-center gap-3">
    <!-- Logo -->
    <img src="../NSS-Logo.png" alt="NSS Logo" class="object-contain w-12 h-12 md:w-20 md:h-20 transition-transform hover:scale-105 duration-200">
    
    <!-- NSS Header-->
    <div class="flex flex-col justify-center">
      <div class="flex items-baseline md:gap-2">
        <span class="text-4xl font-bold md:text-3xl" style="font-family: 'Copse', serif;">NSS</span>
        <span class="text-sm font-semibold text-red-400 md:text-base tracking-wider" style="font-family: 'Copse', serif;">DEGREE UNIT</span>
      </div>
      <span class="text-[10px] md:text-xs italic text-amber-300 -mt-1 font-medium">Not Me But You</span>
    </div>
    <!-- Togglebutton for sidebar in mobile view -->
        <button id="open_sidebar" onclick="toggleSidebar(this)" class="md:hidden fixed text-xs mt-20 ml-3 p-1 w-15 font-bold h-6 c_btn_outline">
         Sidebar</button>
  </div>
  
  <div class="flex items-center gap-6">
    <!-- User Context -->
    <div class="text-right hidden sm:flex flex-col justify-center">
      <div id="name_display" class="text-base font-bold text-white md:text-lg">Name</div>
      <div id="role_display" class="text-sm text-red-300 font-medium">Role</div>
      <div id="username_display" class="text-xs text-gray-300">username</div>
    </div>
    
    
    <div class="flex items-center gap-3">
      <!-- Profile  -->
      <button class="c_btn_outline flex items-center gap-2" onclick="openProfile()">
        <img src="../assets/profile.png" alt="Profile" class="w-4 h-4 invert">
        <span class="hidden md:inline">View Profile</span>
      </button>

      <!-- Logout-->
      <button id="logoutBtn" onclick="logout()"  type="button" class="c_btn_light">
        Logout
      </button>
    </div>
  </div>

</header>
 <div id="update_notice" class="hidden justify-center"><div><p class="text-red-600 text-xl">Registration is OPEN, Update profile to enroll in this year!</p></div></div>
<main class="flex justify-evenly">
  <div id="active_events_container" ></div>
  <div id="pending_feedback_container"></div>
 


</main>
<!-- profile -->
 <!-- For Profile -->

<div id="profile_modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="w-full max-w-lg bg-gray-200 rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    
    
    <div class="px-3 py-4 bg-slate-900 text-white flex justify-between items-center">
      <div class="flex items-center">
        <div class="w-8 h-4 rounded-full bg-blue-600 text-white font-bold text-sm flex items-center justify-center">
          👤
        </div>
        <div>
          <h3 class="text-base text-slate-600 font-bold leading-tight">PROFILE</h3>   
        </div>
      </div>
      <button type="button" onclick="closeProfileModal()" class="text-slate-400 hover:text-white text-xl font-bold transition">
        &times;
      </button>
    </div>

    
    <div class="p-3">
      <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
        Account Details
      </h4>

      
      <div id="profile_fields" >
       
      </div>
    </div>

    
    <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 flex justify-end">
      <button id="academic_update_btn" type="button" onclick="openUpdateModal()" class="px-4 py-2 ml-4 bg-red-500 hover:bg-red-700 text-slate-700 rounded-lg text-sm font-semibold transition">
        Update
      </button>
      <button type="button" onclick="closeProfileModal()"  class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold transition">
        Close
      </button>
      
    </div>

  </div>
</div>

<div id="profile_update_modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="w-full max-w-lg bg-gray-200 rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    
    
    <div class="px-3 py-4 bg-slate-900 text-white flex justify-between items-center">
      <div class="flex items-center">
    
        <div>
          <h3 class="text-base text-slate-600 font-bold leading-tight">UPDATE PROFILE</h3>   
        </div>
      </div>
      <button type="button" onclick="closeUpdateModal()" class="text-slate-400 hover:text-white text-xl font-bold transition">
        &times;
      </button>
    </div>

    
    <div class="p-3">
      <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
        Update Details
      </h4>

      
      <div id="update_fields" >
       
      </div>
    </div>

    
    <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 flex justify-end">
     
      
    </div>

  </div>
</div>

</body>
</html>
