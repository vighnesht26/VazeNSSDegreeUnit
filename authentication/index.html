<!-- Reset Password Modal -->
<div id="forgot_modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4 border border-slate-200">
    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
      <h3 class="font-header text-lg font-bold text-slate-800">Reset Password</h3>
      <button type="button" onclick="closeForgotModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
    </div>

    <form id="forgot_password_form" onsubmit="handlePasswordReset(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" name="username" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-900">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Registered Email</label>
        <input type="email" name="email" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-900">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Registered Contact Number</label>
        <input type="text" id="f_mobile" oninput="validatemobile(this)" name="contact" pattern="[0-9]{10}" required placeholder="10-digit mobile" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-900">
        <p id="f_errormobile" class="text-red-700 text-xs mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">New Password</label>
        <input type="password" id="f_newpass" oninput="validatepass(this)" name="new_password" placeholder="must contains small, capital letter, digit and special character" required minlength="6" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-900">
        <button id="f_passbtn" class=" text-[11px] py-1 px-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg transition" type="button" onclick="toggleshow(this)">
          SHOW
        </button>
        <p id="f_setpass" class="text-red-700 text-xs mt-1"></p>
      </div>
      

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Confirm Password</label>
        <input type="password" oninput="checkpass(this)" id="f_cnfpass" name="confirm_password" required minlength="6" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-900">
        <p id="f_errorpasswd" class="hidden text-red-500 text-xs mt-1"></p>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
        <button type="button" onclick="closeForgotModal()" class="c_btn_light text-xs font-semibold px-4 py-2">Cancel</button>
        <button type="submit" id="btn_reset_submit" class="c_btn text-xs font-semibold px-4 py-2">Reset Password</button>
      </div>
    </form>
  </div>
</div>
</body>
