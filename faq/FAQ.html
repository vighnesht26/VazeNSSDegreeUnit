<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="../output.css" rel="stylesheet">
    <script src="FAQ.js" defer></script>
    <title>Frequently Asked Questions</title>
</head>
<body>
    <div class="max-w-2xl mx-auto p-4 space-y-6 font-sans">
  
  <!-- Ask a Question -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
    <h3 class="text-base font-bold text-slate-800">Have a Question?</h3>
    <textarea 
      id="student_question_input" 
      rows="3" 
      placeholder="Type your question about NSS registration or events..." 
      class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 resize-none"
    ></textarea>
    <div class="flex justify-end">
      <button 
        onclick="submitStudentQuestion()" 
        class="px-5 py-2 bg-blue-950 hover:bg-blue-900 text-white rounded-xl text-xs font-semibold shadow transition">
        Submit Question
      </button>
    </div>
  </div>

  <!-- Answered FAQ -->
  <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
    <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3">Frequently Asked Questions</h3>
    <div id="faq_display_list" class="space-y-3">
      
    </div>
  </div>

</div>
</body>
</html>
