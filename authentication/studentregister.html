<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <link href="../output.css" rel="stylesheet">
  <script src="main.js" defer></script>
  <title>Student Registration</title>

</head>
<body>
     
 
  
  

</header>
        
        <div class="flex justify-center-safe"> <h1 class="font-header font-bold text-4xl text-red-700">Volunteer Registration</h1></div>
  <div class="flex justify-center-safe  ">
   
            <form id=   "std_form" action="stdregister.php" method="POST" onsubmit="submitstudentform(event, this)">
               <div id="form1" class="page active border-2 w-200 flex-row rounded-2xl border-red-700"> 
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3"> 
                <div class="md:col-span-2">
                <label for="name" class="c_label">Enter Name : </label><br>
                <input required autocomplete="additional-name" class="c_in font-bold" id="name" onblur="validatename(this)" oninput="validatename(this)"  type="text" name="y_name" placeholder="Your name">
                <input required class="c_in font-bold " id="f_name" onblur="validatename(this)" oninput="validatename(this)" type="text" name="f_name" placeholder="Father name">
                <input required class="c_in font-bold " id="m_name" onblur="validatename(this)" oninput="validatename(this)" type="text" name="m_name" placeholder="Mother name">
                <input required class="c_in font-bold " id="s_name" onblur="validatename(this)" oninput="validatename(this)" type="text" name="s_name" placeholder="Surname"><br>
                <p id="s_errorname" class="text-red-700 text-xs mt-1 hidden"></p>
                </div>

                <div>
                <label for="s_email" class="c_label">Email :</label><br>
                <input required class="c_in mt-2" oninput="validateEmail(this)" id="s_email" type="email" name="s_email" placeholder="example@gmail.com">
                <p id="s_erroremail" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>

                <div>
                <label for="s_mobile" class="c_label " >Mobile No.:</label><br>
                <input required class="c_in  mt-2 " oninput="validatemobile(this)" id="s_mobile" type="text" name="s_mobile" placeholder="Enter Mobile No.">
                <p id="s_errormobile" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>
            
                <div> 
                <label for="s_DOB" class="c_label">Date of Birth :</label><br>
                <input required class="c_in mt-2" oninput="validateDate(this)" onchange="validateDate(this)" type="date" id="s_DOB" name="s_DOB">
                <p id="s_errordate" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>
        
                <div>
                <label for="s_gender" class="c_label">Gender :</label><br>
                <select required id="s_gender" onclick="validatedropdown(this)" class="c_dropdown" name="s_gender">
                    <option value="" disabled selected hidden>Not Selected</option>
                    <option value="Male" >Male</option>
                    <option value="Female">Female</option>
                </select>
                 <p id="s_errorgender" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>

                <div>
                <label  for="bld_grp" class="c_label">Blood Grp :</label>
                <select required class="c_dropdown "  onclick="validatedropdown(this)" id="bld_grp" name="bld_grp">
                    <option value="" selected disabled hidden>Not selected</option>
                    <option value="A+" >A+</option>
                    <option value="B+">B+</option>
                    <option value="AB+">AB+</option>
                    <option value="O+">O+</option>
                    <option value="A-">A-</option>
                    <option value="B-">B-</option>
                    <option value="AB-">AB-</option>
                    <option value="O-">O-</option>
                </select>
                 <p id="s_errorbld" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>

                <div>
                <label for="caste" class="c_label">Caste :</label><br>
                <select required class="c_dropdown " onclick="validatedropdown(this)" id="caste" name="s_caste" >
                    <option value="" selected disabled hidden>Not selected</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="OBC">OBC</option>
                    <option value="SC">SC</option>
                    <option value="ST">ST</option>
                    <option value="MINOR">MINOR</option>
                </select>
                 <p id="s_errorcaste" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>

                <div>
                <label for="nssyear" class="c_label">NSS Year :</label>
                <select required class="c_dropdown " onclick="validatedropdown(this)" id="nssyear" name="nssyear">
                    <option value="" selected disabled hidden>Not selected</option>
                    <option value="FY">First year</option>
                    <option value="SY">Second year</option>
                    <option value="TY">Third year</option>
                </select>
                 <p id="s_errornssyr" class="text-red-700 text-xs mt-1  hidden"></p>
                </div>
            </div>
                <div class=" flex justify-center"><button type="button" onclick="validnext(this);" class="c_btn mt-3 ">Next</button></div>
                
                </div>
        
<!-- Academic details -->
                <div  id="form2" class=" page border-2 p-2 rounded-2xl border-red-700">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-3">

                    <div>
                    <label for="s_class" class="c_label">Select Class :</label>
                    <select required class="c_dropdown " onclick="validatedropdown(this)" id="s_class" name="s_class">
                         <option value="" selected disabled hidden>Not selected</option>
                        <option value="FY">FY</option>
                        <option value="SY">SY</option>
                        <option value="TY">TY</option>
                    </select>
                     <p id="s_errorclass" class="text-red-700 text-xs mt-1  hidden"></p>
                    </div>

                    <div>
                    <label for="s_program" class="c_label">Select Program :</label> 
                    <select required class="c_dropdown" onclick="validatedropdown(this)" id="s_program" name="s_program" >
                        <option value="" selected disabled hidden>Not Selected</option>
                        <option value="BA">BA</option>
                        <option value="BSC">BSC</option>
                        <option value="BCOM">BCOM</option>
                        <option value="BAF">BAF</option>
                        <option value="BBI">BBI</option>
                        <option value="BAMMAC">BAMMAC</option>
                        <option value="BMS">BMS</option>
                        <option value="BVOC">BVOC</option>
                        <option value="BSCIT">BSC-IT</option>
                        <option value="BSCBT">BSC-BT</option>
                        <option value="BSCAIML">BSC-AIML</option>
                        <option value="BSCDS">BSC-DS</option>
                       
                    </select>
                     <p id="s_errorprogram" class="text-red-700 text-xs mt-1  hidden"></p>
                    </div>

                    <div>
                    <label for="s_div" class="c_label">Enter Division :</label>
                    <select required id="s_div" class="c_in mt-2 " onclick="validatedropdown(this)" type="text"  name="s_div">
                        <option value="" selected disabled hidden>Not Selected</option>
                        <option value ='A'>A</option>
                         <option value ='B'>B</option>
                          <option value ='C'>C</option>
                           <option value ='E'>E</option>
                           
                    </select>
                    <p id="s_errordiv" class="text-red-700 text-xs mt-1  hidden"></p>
                    </div>

                    <div>
                    <label for="s_roll" class="c_label ">Enter Roll No. :</label>
                    <input required class="c_in mt-2" oninput="checkRoll(this)" type="text" pattern="\d{3}" id="s_roll" name="s_roll" placeholder="eg., 001"> <br><br>
                    <p id="s_errorRoll" class="text-red-700 text-xs mt-1  hidden"></p>
                    </div>

                    <div>
                    <label  class="c_label" for="s_newpass">Password :</label><br>
                    <input id="s_newpass" required class="c_in" oninput="validatepass(this)" type="password" placeholder="Enter password" ><br>
                    <p id="s_setpass" class="text-red-700 text-xs mt-1  hidden"></p>
                    <button id="s_passbtn"  class="text-xs py-2 px-1  bg-back  rounded-xl md:text-xs font-bold shadow-md transition-all duration-200 cursor-pointer active:scale-95   " type="button" onclick="toggleshow(this)">SHOW</button><br>
                    </div>
                    
                    <div>
                    <label for="s_cnfpass" class="c_label">Confirm Password :</label><br>
                    <input required id="s_cnfpass" oninput="checkpass(this)" class="c_in" type="password" name="s_pass" placeholder="Enter password"><br>
                        <p id="s_errorpasswd" class="hidden text-red-500 text-xs mt-1"></p>
                    </div>
                    <div class="flex justify-center-safe">
                    
                
                    <button type="button" class="c_btn " onclick="nextpage('form1')">Back</button>
                    <button type="submit" name="s_submit " class="c_btn ml-45" >SUBMIT</button>
                    </div>
                </div>
            </form>
        </div>
    

</body>
</html>
