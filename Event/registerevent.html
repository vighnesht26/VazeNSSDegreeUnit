<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../output.css" rel="stylesheet">
    <script src="event.js" defer></script>
  <title>Event Registration</title>
</head>
<body class="bg-gray-200 font-sans min-h-screen">

  <!-- Header Section -->
  <header class="sticky top-0 z-50 flex items-center justify-between w-full h-24 px-6 text-white bg-navy ">
  
  <!-- Main Heading-->
  <div class="flex items-center ">
    <!-- Logo -->
    <img src="../NSS-Logo.png" alt="NSS Logo" class="object-contain w-12 h-12 md:w-20 md:h-20">
    
    <!-- NSS Header-->
    <div class="flex flex-col justify-center">
      <div class="flex items-baseline gap-2">
        <span class="text-4xl font-bold font-header  md:text-3xl">NSS</span>
        <span class="text-sm font-semibold font-header  text-lightperi md:text-base">DEGREE UNIT</span>
      </div>
      <span class="text-[10px] md:text-xs italic font-text text-gray-300 -mt-1">Not Me But You</span>
    </div>
  </div>

 
  
  

</header>
 
    <main class="max-w-4xl mx-auto ">
        
        <form method="" action="">
            <h4 class="font-bold text-4xl font-header text-dorg">Event Registration</h4>
            <div class="border-2 flex gap-3  w-200 flex-wrap rounded-3xl border-navy">
                <div class="flex-col  pl-4">
                    <label for="Name" class="c_label ">Event Name* :</label>
                    <input required id="Name" name="e_name" type="text" class="c_in mt-2"><br>
                    <label for="Date" class="c_label ">Date* :</label>
                    <input required id="Date" name="e_date" type="date" class="c_in mt-2 ml-14"><br>
                    <label for="Time" class="c_label ">Time* :</label>
                    <input required id="Time" name="e_time" type="time" class="c_in mt-2 ml-14"><br>
                    <label for="Venue" class="c_label ">Venue* : </label>
                    <input required id="Venue" name="e_venue" type="text" class="c_in mt-2 ml-11"><br>
                    <label for="Org" class="c_label ">Organiser* : </label>
                    <input required id="Org" name="e_org" type="text" class="c_in mt-2 ml-6"><br>
                    <label for="Coll" class="c_label ">Collaboration :</label>
                    <input id="Coll" name="e_collab" type="text" class="c_in mt-2 "><br>
                    
                </div>
                
                <div class=" pl-4">
                    <label for="Type" class="c_label ">Event Type* :</label>
                    <select required name="e_type" id="Type"  class=" mt-2 ml-10 p-2 border-2 border-blue-600 rounded-2xl">
                         <option selected disabled hidden value="">Not Selected</option>
                        <option value="CL">College Level</option>
                         <option value="UL">University Level</option>
                          <option value="ABP-1">Area Based Project-1</option>
                           <option value="ABP-2">Area based Project-2</option>
                            <option value="DL">District Level</option>
                    </select><br>
                    <label for="Ah" class="c_label ">Approx Hour* :</label>
                    <input required name="e_AH" id="Ah" type="number" min="1"  class="c_in mt-2 ml-6"><br>
                    <label  for="MP" class="c_label ">Max Participation :</label>
                    <input  id="MP" name="e_MP" type="number" min="1" class="c_in mt-2 "><br>
                    <label required  for="Status" class="c_label ">Status* :</label>
                    <select id="Status" name="e_status" type="text" onchange="updateStatusColor(this)" class="mt-2 ml-20 p-2 border-2 border-blue-600 rounded-2xl">
                        <option selected disabled hidden>Not Selected</option>
                        <option value="Tentative" class="font-semibold text-org">Tentative</option>
                        <option value="Scheduled" class="font-semibold text-yellow-700">Scheduled</option>
                        <option value="Active" class="font-semibold text-green-700">Active</option>
                        <option value="Completed" class="font-semibold text-gray-600">Completed</option>
                        <option value="Cancelled" class="font-semibold text-red-800">Cancelled</option>
                    </select><br>

                    <label for="RT" class="c_label ">Reporting Time:</label>
                    <input id="RT" name="e_rtime" type="time" class="c_in mt-2"><br>
                    <label for="RV"  class="c_label ">Reporting Venue:</label>
                    <input id="RV" name="e_rvenue" type="text" class="c_in mt-2">
                </div>
                <div class=" flex w-150 flex-wrap justify-center ">
                     
                    <textarea id="Desc" name="e_desc" placeholder="Description" rows="4" name="e_desc" type="text" class="p-2 border-2 border-blue-600 rounded-2xl  mt-2 ml-2 h-20 w-150  resize-none"></textarea><br>
                    <button type="submit" name="e_submit"  class="c_btn ml-150 mt-2 ">Submit</button>
                </div>
                   
            </div>
        </form>
    
    </main>

</body>


</html>
