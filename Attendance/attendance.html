<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
  <link href="../output.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="Attendance.js" defer></script>
  <title>Attendance</title>

</head>
<body class="flex flex-col h-screen">
  <!-- NSS Heading -->
   <header class="top-header sticky top-0  flex items-center justify-between w-full h-15 px-6 text-white">
  
  <!-- Main Heading-->
  <div class="flex items-center gap-3">
    <!-- Logo -->
    <img src="../NSS-Logo.png" alt="NSS Logo" class="object-contain w-12 h-12 md:w-20 md:h-20 transition-transform hover:scale-105 duration-200">
    
    <!-- NSS Header-->
    <div class="flex flex-col justify-center">
      <div class="flex items-baseline md:gap-2">
        <span class="text-4xl font-bold md:text-3xl" style="font-family: 'Copse', serif;">NSS</span>
        <span class="text-sm font-semibold text-red-400 md:text-base tracking-wider" style="font-family: 'Copse', serif;">DEGREE UNIT</span>
      </div>
      <span class="text-[10px] md:text-xs italic text-amber-300 -mt-1 font-medium">Not Me But You</span>
    </div>
    <div  class="font-bold text-2xl ml-50 font-header">
        <span id="event_name_header" >Event Name</span>

    </div>
    <div class="flex justify-evenly  w-50 font-bold"  >
        <span id="event_date_header" >Date</span>
        <span id="event_time_header" >Time</span>
    </div>
  </div>
  

</header>
<main class="border-2 h-full  w-full">
   <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4 border border-slate-200">
  
  
  <div class="flex items-center space-x-4">
    <span class="text-slate-700 font-semibold text-sm">
      Total Registered: <span id="total_volunteers" class="font-bold text-blue-900">0</span>
    </span>
    <span class="text-slate-700 font-semibold text-sm">
      Marked Present: <span id="present_count" class="font-bold text-emerald-600">0</span>
    </span>
    <span id="attendance_status" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300 uppercase">
      Open
    </span>
  </div>

 
  <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
    
    <div class="relative flex-1 sm:w-64">
      <input 
        type="text" 
        id="volunteer_search" 
        onkeyup="filterVol()"
        placeholder="Search name, roll no, class..." 
        class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-950 focus:border-transparent"
      />
      
     
    </div>

    
    <button id="mark_reporting_btn" onclick="saveAttendanceStatus()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
      Save Reporting Progress
    </button>

    <button id="final_submit_btn" onclick="saveFinalAttendance()" class="bg-blue-950 hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
      Final Submit
    </button>

    <!-- Export to Excel -->
    <button id="export_excel_btn" onclick="exportToExcel()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
      Export Excel
    </button>
  </div>
</div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table id="attendance_table" class="w-full text-left text-sm text-slate-700">
          <thead class="bg-slate-100 text-slate-900 font-bold border-b border-slate-200">
            <tr>
              <th class="p-4 border-b">Sr.No.</th>
              <th class="p-4 border-b">Volunteer Name</th>
              <th class="p-4 border-b">Gender</th>
              <th class="p-4 border-b">Class & Program</th>
              <th class="p-4 border-b">Roll No.</th>
              <th class="p-4 border-b">Mobile</th>
              <th class="p-4 border-b text-center">Reporting Done</th>
            </tr>
          </thead>
          <tbody id="volunteer_list_body" class="divide-y divide-slate-200 bg-white">
            
          </tbody>
        </table>
      </div>
    </div>
</main>


//exporting

<div id="export_modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50  items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-200">
    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
      <h3 class="text-lg font-bold text-slate-800">Select Export Columns</h3>
      <button onclick="closeExportModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
    </div>

    <p class="text-xs text-slate-500">Check the columns you want to include in the Excel report:</p>

    <!-- Column Checkboxes -->
    <div class="grid grid-cols-2 gap-3 text-sm max-h-60 overflow-y-auto p-1">
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="sr_no" checked />
        <span>SR No.</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="name" checked />
        <span>Volunteer Name</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="gender" checked />
        <span>Gender</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="class_prog" checked />
        <span>Class & Program</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="roll_no" checked />
        <span>Roll No.</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="mobile" checked />
        <span>Mobile Number</span>
      </label>
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="export-col-cb w-4 h-4 text-emerald-600 rounded" value="email" checked />
        <span>Email Address</span>
        </label>
      
      
      
      
    </div>

    
    <div class="flex justify-between items-center pt-3 border-t border-slate-100">
      <button onclick="toggleAllExportCols(this)" class="text-xs text-blue-900 font-semibold hover:underline">Deselect All</button>
      <div class="flex space-x-2">
        <button onclick="closeExportModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">Cancel</button>
        <button onclick="confirmExcelExport()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold shadow">Download Excel</button>
      </div>
    </div>
  </div>
</div>
    

</body>
</html>
